<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8">
		<title>Proyecto no seleccionado</title>
		<!-- Bootstrap CSS -->
		<link
		href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
		<!-- Bootstrap Icons -->
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
		<style>
			body {
				background-color: #f8f9fa;
				font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			}
			.modal-content {
				border-radius: 1rem;
				box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
			}
			.modal-header {
				background-color: #6c757d;
				color: white;
				border-top-left-radius: 1rem;
				border-top-right-radius: 1rem;
			}
			.modal-body {
				padding: 2rem;
			}
			.btn-primary {
				background-color: #0d6efd;
				border-color: #0d6efd;
				font-weight: 600;
				padding: 0.75rem 1.5rem;
				border-radius: 0.5rem;
			}
			.btn-primary:hover {
				background-color: #0b5ed7;
				border-color: #0b5ed7;
			}
			.icono-advertencia {
				font-size: 3rem;
				color: #ffc107;
				margin-bottom: 1rem;
			}
		</style>
	</head>
	<body>
		<div id="modal-proyecto-no-seleccionado" class="modal fade show d-block" tabindex="-1" role="dialog" aria-labelledby="modalProyectoLabel" aria-hidden="true" style="background-color: rgba(0,0,0,0.5);">
			<div id="dialog-proyecto-no-seleccionado" class="modal-dialog modal-dialog-centered" role="document">
				<div id="content-proyecto-no-seleccionado" class="modal-content">
					<div id="header-proyecto-no-seleccionado" class="modal-header">
						<h5 class="modal-title" id="modalProyectoLabel">
							<i class="bi bi-exclamation-triangle-fill me-2"></i>
							Proyecto no seleccionado</h5>
						<button type="button" id="btn-cerrar-modal" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
					</div>
					<div id="body-proyecto-no-seleccionado" class="modal-body text-center">
						<div id="icono-advertencia" class="icono-advertencia">
							<i class="bi bi-exclamation-triangle"></i>
						</div>
						<p id="mensaje-principal" class="lead mb-4">Para continuar, debes crear o seleccionar un proyecto.</p>
						<p id="mensaje-instruccion">Por favor, ve a la pestaña
							<strong>"Proyectos"</strong>
							para crear uno nuevo o seleccionar uno existente.</p>
						<div id="contenedor-boton-accion" class="mt-4">
							<a id="btn-ir-proyectos" href="{{ url_for('seleccionar_proyecto') }}" class="btn btn-primary">
								<i class="bi bi-folder-plus me-2"></i>
								Ir a Proyectos
							</a>
						</div>
					</div>
				</div>
			</div>
		</div>

		<!-- Bootstrap JS Bundle with Popper -->
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
		<script>
			// Cerrar el modal si se hace clic fuera de él
document.addEventListener('click', function (event) {
const modal = document.getElementById('modal-proyecto-no-seleccionado');
if (modal && ! modal.contains(event.target)) {
modal.remove();
}
});

// Cerrar el modal con la tecla ESC
document.addEventListener('keydown', function (event) {
if (event.key === 'Escape') {
const modal = document.getElementById('modal-proyecto-no-seleccionado');
if (modal) {
modal.remove();
}
}
});
		</script>
	</body>
</html>
