{% extends "base.html" %}
{% block title %}Guía de Uso - {{ nombre_aplicacion }}{% endblock %}
{% block content %}
<div id="contenedor-cabecera-manual" class="d-flex justify-content-between align-items-center mb-4">
  <img id="logo-ctpd" src="{{ url_for('static', filename='img/logo_ctpdandalucia.png') }}" alt="Logo" style="height: 80px;">
  <h1 id="titulo-guias-rapidas" class="text-center flex-grow-1">Guías rápidas</h1>
  <img id="logo-junta" src="{{ url_for('static', filename='img/logo_junta.png') }}" alt="Logo Junta" style="height: 80px;">
</div>

<!-- Lista dinámica de manuales/guías desde BD -->
{% for manual in manuales %}
<div id="ayuda-inline-{{ manual.C_AYUDA }}"
    data-ayuda-inline="{{ manual.C_AYUDA }}"
    data-ayuda-titulo="{{ manual.D_TITULO }}"
    data-ayuda-collapsed="{{ 'true' if manual.L_COLAPSADO == 1 else 'false' }}">
</div>
{% else %}
<!-- Mensaje si no hay manuales configurados -->
<div class="alert alert-info" role="alert">
  <i class="bi bi-info-circle me-2"></i>
  No hay guías disponibles en este momento.
</div>
{% endfor %}

<!-- Botón de volver -->
<div id="contenedor-navegacion-manual" class="d-grid gap-3 d-md-flex justify-content-start mt-4">
  <button id="btn-volver" class="btn btn-outline-secondary btn-lg rounded-pill">
    ⬅ Volver
  </button>
</div>

<script>
(function() {
    // Guardar la URL de origen al cargar la página (sin el hash)
    // Usamos document.referrer como página de destino al volver
    const urlOrigen = document.referrer || '/';

    document.getElementById('btn-volver').addEventListener('click', function() {
        // Navegar directamente a la página de origen, ignorando el historial de anclas
        window.location.href = urlOrigen;
    });
})();
</script>

{% endblock %}
